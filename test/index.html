<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yükleniyor...</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fa;
      font-family: Arial, sans-serif;
    }

    .loading {
      text-align: center;
    }

    .spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      border: 5px solid #dfe5ec;
      border-top-color: #16a66a;
      border-radius: 50%;
      animation: don 0.8s linear infinite;
    }

    .loading p {
      color: #444;
      font-size: 16px;
      font-weight: 600;
    }

    @keyframes don {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="loading">
    <div class="spinner"></div>
    <p>Yükleniyor...</p>
  </div>
</body>
</html>
